ball_detector:
  ros__parameters:
    wamv: asv

    min_x_size: 0.1
    min_y_size: 0.1
    min_z_size: 0.1

    max_x_size: 0.6
    max_y_size: 0.6
    max_z_size: 0.3

    min_detect_dist: 0.0
    max_detect_dist: 10.0

    min_detect_height: -10.0
    max_detect_height: 10.0

    min_cluster_size: 1
    max_cluster_size: 150

    radius_scale: 1.5
    min_radius_m: 0.05

    range_rows: 16
    range_cols: 720
    v_angle_min_deg: -30.0
    v_angle_max_deg: 30.0
    horiz_fov_deg: 360.0

    range_jump_thresh_m: 0.5
    neighbor_row_window: 1
    neighbor_col_window: 3
    min_range_m: 0.0
    max_range_m: 60.0

    accumulation_scans: 1
    accumulate_only_when_static: true
    max_accum_translation_m: 0.3
    max_accum_yaw_deg: 10.0