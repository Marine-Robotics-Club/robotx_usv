pyramid_buoy_detector:
  ros__parameters:
    min_x_size: 0.3
    min_y_size: 0.3
    min_z_size: 0.3
    max_x_size: 0.5
    max_y_size: 0.5
    max_z_size: 1.2
    min_detect_dist: 1.0
    max_detect_dist: 20.0

    # NEW: z limits
    min_detect_height: -3.0
    max_detect_height: -0.5

    cluster_tolerance: 0.5
    min_cluster_size: 15
    max_cluster_size: 25000
